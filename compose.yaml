# Local development stack. Phase 3: PostgreSQL + PostGIS only.
#
#   cp .env.example .env   # set a real POSTGRES_PASSWORD — never commit .env
#   pnpm db:up && pnpm db:migrate && pnpm db:verify
#
# Security: the DB port is published on 127.0.0.1 ONLY (hard-coded below, not
# taken from .env, so it cannot be widened by accident). Docker-published ports
# bypass UFW, so never change this to 0.0.0.0 or drop the host IP. Remote access
# goes through an SSH tunnel: ssh -L 5432:127.0.0.1:5432 surveyadmin@<server>
name: cctv-survey

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cctv_survey}
      POSTGRES_USER: ${POSTGRES_USER:-cctv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18+ images keep PGDATA in a versioned subdirectory of this path.
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    shm_size: 256mb
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Phase 7 Step 4 — loopback-only container test stack (profile "stacktest").
  # Start/stop ONLY via scripts/stack.sh. Nothing below uses the `db` service,
  # the `backend` network or the `pgdata` volume: the API talks to its own
  # throwaway database (`stacktest-db`, data on tmpfs, gone when stopped).
  # ---------------------------------------------------------------------------
  stacktest-db:
    profiles: ['stacktest']
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: cctv_stacktest
      POSTGRES_USER: cctv_stacktest
      # Random per `scripts/stack.sh up`; empty otherwise (the stack then fails
      # to start instead of using a weak default).
      POSTGRES_PASSWORD: ${STACKTEST_DB_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      TZ: UTC
    tmpfs:
      - /var/lib/postgresql:size=512m
    volumes:
      # Applied once at init, after the image's own PostGIS setup (10_postgis.sh).
      - ./infra/db/migrations/0001_init.sql:/docker-entrypoint-initdb.d/20_0001_init.sql:ro
      - ./infra/db/migrations/0002_auth.sql:/docker-entrypoint-initdb.d/21_0002_auth.sql:ro
    networks:
      - stacktest-data
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cctv_stacktest -d cctv_stacktest']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    profiles: ['stacktest']
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: cctv-survey-api:stacktest
    environment:
      NODE_ENV: production
      # 0.0.0.0 is only accepted together with API_CONTAINER_NETWORK=internal
      # (see apps/api/src/common/loopback.ts); no port is published.
      API_HOST: 0.0.0.0
      API_PORT: '4000'
      API_CONTAINER_NETWORK: internal
      # 1: only Caddy writes X-Forwarded-For; Next.js passes it on unchanged
      # (see apps/api/src/config/proxy.ts).
      TRUST_PROXY_HOPS: '1'
      DATABASE_URL: postgresql://cctv_stacktest:${STACKTEST_DB_PASSWORD:-}@stacktest-db:5432/cctv_stacktest
      JWT_SECRET: ${STACKTEST_JWT_SECRET:-}
      JWT_EXPIRES_IN: 8h
      CORS_ORIGIN: https://localhost:8443,https://127.0.0.1:8443
    depends_on:
      stacktest-db:
        condition: service_healthy
    networks:
      - stacktest-app
      - stacktest-data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    profiles: ['stacktest']
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Baked into the build: Next.js rewrites /api/* here (server-side only).
        API_INTERNAL_URL: http://api:4000
    image: cctv-survey-web:stacktest
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - stacktest-edge
      - stacktest-app
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  proxy:
    profiles: ['stacktest']
    build:
      context: .
      # Official caddy:2-alpine (pinned) minus the binary's file capability.
      dockerfile: infra/docker/proxy.Dockerfile
    image: cctv-survey-proxy:stacktest
    # Loopback only (Step 4). Docker-published ports bypass UFW, so the host IP
    # must always be explicit. Caddy listens on 8443/8080 inside the container,
    # so it needs no capabilities at all (see infra/docker/proxy.Dockerfile).
    ports:
      - '127.0.0.1:8443:8443'
      - '127.0.0.1:8080:8080'
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Internal CA (incl. its private key) and certificates. Never delete.
      - caddy_stacktest_data:/data
      - caddy_stacktest_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      - stacktest-edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    healthcheck:
      # Full path through Caddy (TLS) to web. Internal CA: not verified here.
      test:
        - CMD
        - wget
        - -q
        - --spider
        - --no-check-certificate
        - https://localhost:8443/login
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  # Private network for api <-> db traffic once the API is containerised (Phase 7).
  backend:
    driver: bridge
  # Phase 7 Step 4 test stack (profile "stacktest"): proxy <-> web only.
  stacktest-edge:
    driver: bridge
  # web <-> api. internal: no route to the outside world.
  stacktest-app:
    driver: bridge
    internal: true
  # api <-> stacktest-db. internal; `db` is NOT attached here.
  stacktest-data:
    driver: bridge
    internal: true

volumes:
  # Named volume: survives `docker compose down`. Only `down -v` deletes it.
  pgdata:
  # Caddy internal CA + certificates for the Step 4 test stack. Never delete.
  caddy_stacktest_data:
  caddy_stacktest_config:
